<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Đặc Biệt</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .question {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 25px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }
        .option-btn:hover {
            background: #ffe3e3;
            border-color: #ff8787;
            color: #e03131;
            font-weight: bold;
            transform: translateY(-2px);
        }
        .hidden {
            display: none !important;
        }
        .result-title {
            color: #e03131;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }
        .result-text {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #2d3436;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- Màn hình câu hỏi -->
    <div id="quiz-screen">
        <div class="question">Kiệt thích gì?</div>
        <div class="options-container">
            <button class="option-btn" data-original="A. Mèo" onmouseenter="trollIn(this)" onmouseleave="trollOut(this)" onclick="showResult()">A. Mèo</button>
            <button class="option-btn" data-original="B. Chó" onmouseenter="trollIn(this)" onmouseleave="trollOut(this)" onclick="showResult()">B. Chó</button>
            <button class="option-btn" data-original="C. Ngủ" onmouseenter="trollIn(this)" onmouseleave="trollOut(this)" onclick="showResult()">C. Ngủ</button>
            <button class="option-btn" data-original="D. Học" onmouseenter="trollIn(this)" onmouseleave="trollOut(this)" onclick="showResult()">D. Học</button>
        </div>
    </div>

    <!-- Màn hình hiện đáp án cuối cùng -->
    <div id="result-screen" class="hidden">
        <h2 class="result-title">Kết Quả Chính Xác! 🎉</h2>
        <p class="result-text">
            Dù có chọn đằng trời thì câu trả lời đúng duy nhất vẫn là: <br>
            <strong style="font-size: 1.5rem; color: #e03131;">Kiệt thích Nhi! ❤️</strong>
        </p>
    </div>
</div>

<script>
    // Khi rê con trỏ chuột vào nút
    function trollIn(element) {
        element.innerText = "Nhi";
    }

    // Khi di chuột ra ngoài nút
    function trollOut(element) {
        element.innerText = element.getAttribute('data-original');
    }

    // Khi bấm chọn vào nút
    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
